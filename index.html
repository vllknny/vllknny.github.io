<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="color-scheme" content="dark" />
<title>Kunal Ghosh — vllknny</title>
<meta name="description" content="Kunal Ghosh — computational data science, audio engineering, DSP and machine learning. A vault of notes, projects and READMEs." />
<link rel="icon" type="image/png" href="https://avatars.githubusercontent.com/u/104706563?v=4" />
<link rel="apple-touch-icon" href="https://avatars.githubusercontent.com/u/104706563?v=4" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,500;0,700;1,400&display=swap" rel="stylesheet" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<style>
:root{
  --r0:#1b1a19;          /* ribbon, tab bar */
  --r1:#262422;          /* sidebar */
  --r2:#212121;          /* editor */
  --border:#363330;
  --hover:rgba(255,245,230,.06);
  --active:rgba(255,245,230,.10);
  --text:#dcdad6;
  --muted:#9a948d;
  --faint:#6d6862;
  --accent:#8b7cf6;      /* obsidian purple */
  --accent-soft:rgba(139,124,246,.16);
  --link:#6fae5c;        /* external links, as in the vault */
  --ilink:#a99cf7;       /* internal links */
  --code:#2a2826;
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--r0);color:var(--text);font:14px/1.6 var(--mono);overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
a{color:inherit}
.ic{flex:none;display:block}
::selection{background:rgba(139,124,246,.35)}
*{scrollbar-width:thin;scrollbar-color:#45413d transparent}

.app{display:flex;height:100vh;height:100dvh}

/* ── ribbon ── */
.ribbon{width:44px;flex:none;background:var(--r0);display:flex;flex-direction:column;align-items:center;padding:10px 0;gap:4px;border-right:1px solid var(--border)}
.ribbon .sp{flex:1}
.rbtn{width:32px;height:32px;border-radius:6px;display:grid;place-items:center;color:var(--muted);cursor:pointer;border:0;background:none;text-decoration:none}
.rbtn:hover{background:var(--hover);color:var(--text)}
.rbtn.on{background:var(--active);color:var(--text)}

/* ── sidebar ── */
.sidebar{width:268px;flex:none;background:var(--r1);display:flex;flex-direction:column;border-right:1px solid var(--border);min-width:0}
.vault{display:flex;align-items:center;gap:8px;padding:12px 14px 8px;font-weight:500}
.vault small{color:var(--faint);font-weight:400;margin-left:auto}
.editbar{display:none;gap:4px;padding:2px 10px 8px;flex-wrap:wrap}
body.editing .editbar{display:flex}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 9px;border-radius:6px;background:var(--hover);border:1px solid var(--border);color:var(--muted);cursor:pointer;font-size:12px}
.chip:hover{color:var(--text);border-color:#4a4642}
.tree{flex:1;overflow:auto;padding:4px 8px 16px}
.row{display:flex;align-items:center;gap:8px;padding:4px 8px;border-radius:6px;cursor:pointer;color:var(--muted);white-space:nowrap;text-decoration:none;user-select:none}
.row span.l{overflow:hidden;text-overflow:ellipsis;flex:1}
.row:hover{background:var(--hover);color:var(--text)}
.row.active{background:var(--active);color:var(--text)}
.row .chev{transition:transform .15s}
.row.open .chev{transform:rotate(90deg)}
.row.folder{color:var(--text)}
.kids{margin-left:14px;border-left:1px solid var(--border);padding-left:2px}
.kids[hidden]{display:none}
.side-foot{display:flex;align-items:center;gap:8px;padding:10px 14px;border-top:1px solid var(--border);color:var(--faint);font-size:12px}

/* ── main ── */
.main{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--r2);position:relative}
.tabbar{display:flex;align-items:flex-end;background:var(--r0);height:42px;padding:0 8px;border-bottom:1px solid var(--border);gap:2px}
.tabs{display:flex;align-items:flex-end;gap:2px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{display:flex;align-items:center;gap:8px;padding:0 8px 0 11px;height:34px;border-radius:8px 8px 0 0;color:var(--muted);max-width:200px;min-width:90px;cursor:pointer;white-space:nowrap;flex:none}
.tab:hover{background:var(--hover)}
.tab.on{background:var(--r2);color:var(--text);box-shadow:inset 0 2px 0 var(--accent)}
.tab .t{overflow:hidden;text-overflow:ellipsis;flex:1}
.tab .x{display:grid;place-items:center;width:20px;height:20px;border-radius:5px;border:0;background:none;color:var(--faint);cursor:pointer;opacity:0}
.tab:hover .x,.tab.on .x{opacity:1}
.tab .x:hover{background:var(--active);color:var(--text)}
.tabbar .rbtn{height:30px;margin-bottom:2px}
.editflag{display:none;align-self:center;margin:0 6px;padding:1px 8px;border-radius:999px;background:var(--accent-soft);color:#c1b8fa;font-size:11px;letter-spacing:.06em}
body.editing .editflag{display:inline-block}
.vhead{display:flex;align-items:center;height:42px;padding:0 12px;gap:4px;color:var(--muted);flex:none}
.crumbs{flex:1;min-width:0;display:flex;align-items:center;gap:8px;padding-left:6px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.crumbs b{color:var(--text);font-weight:500}
.crumbs i{font-style:normal;color:var(--faint)}
.scroll{flex:1;overflow:auto;min-height:0;position:relative}
.note{max-width:780px;margin:0 auto;padding:26px 44px 140px}
.inline-title{font-size:1.95rem;line-height:1.25;font-weight:700;margin:0 0 16px;letter-spacing:-.01em;word-break:break-word}

/* properties */
.props{border:1px solid var(--border);border-radius:10px;padding:6px 14px;margin:0 0 24px;background:rgba(255,255,255,.015)}
.prow{display:grid;grid-template-columns:112px 1fr;gap:10px;padding:5px 0;align-items:center;font-size:13px}
.pk{color:var(--faint);display:flex;align-items:center;gap:7px}
.pv{min-width:0;overflow:hidden;text-overflow:ellipsis}
.pill{display:inline-block;background:var(--accent-soft);color:#bdb4fa;border-radius:999px;padding:0 10px;margin:2px 4px 2px 0;font-size:12px;text-decoration:none;cursor:pointer;line-height:1.6}
.pill:hover{background:rgba(139,124,246,.28)}

/* markdown */
.md{font-size:14.5px;line-height:1.8;overflow-wrap:break-word}
.md>*:first-child{margin-top:0}
.md h1,.md h2,.md h3,.md h4,.md h5,.md h6{line-height:1.3;margin:1.7em 0 .55em;font-weight:700}
.md h1{font-size:1.7rem}.md h2{font-size:1.38rem}.md h3{font-size:1.14rem}.md h4{font-size:1rem}.md h5,.md h6{font-size:.92rem;color:var(--muted)}
.md p{margin:.8em 0}
.md a{color:var(--link);text-underline-offset:3px;text-decoration-thickness:1px}
.md a.wikilink{color:var(--ilink)}
.md a.ext::after{content:"↗";font-size:.78em;margin-left:3px;opacity:.7}
.md .wikilink.unresolved{color:var(--faint);text-decoration:underline dotted;cursor:help}
.md ul,.md ol{padding-left:1.5em;margin:.7em 0}
.md li{margin:.25em 0}
.md li::marker{color:var(--faint)}
.md li>input[type=checkbox]{margin-right:8px;accent-color:var(--accent)}
.md hr{border:0;border-top:1px solid var(--border);margin:2em 0}
.md blockquote{margin:1em 0;padding:.1em 1em;border-left:3px solid var(--accent);color:var(--muted)}
.md img{max-width:100%;height:auto;border-radius:6px}
.md code{background:var(--code);padding:.12em .42em;border-radius:5px;font-size:.88em}
.md pre{position:relative;background:var(--code);border:1px solid var(--border);border-radius:10px;padding:14px 16px;overflow:auto;font-size:13px;line-height:1.65;margin:1.1em 0}
.md pre code{background:none;padding:0;font-size:inherit}
.md pre .copy{position:absolute;top:8px;right:8px;opacity:0;background:var(--r1);border:1px solid var(--border);color:var(--muted);border-radius:6px;padding:2px 8px;font-size:11px;cursor:pointer}
.md pre:hover .copy{opacity:1}
.md .tbl{overflow:auto;margin:1em 0}
.md table{border-collapse:collapse;width:100%;font-size:13.5px}
.md th,.md td{border:1px solid var(--border);padding:7px 12px;text-align:left;vertical-align:top}
.md th{background:rgba(255,255,255,.03);font-weight:500}
.md details{border:1px solid var(--border);border-radius:8px;padding:6px 14px;margin:1em 0}
.md summary{cursor:pointer;color:var(--muted)}
.md kbd{background:var(--code);border:1px solid var(--border);border-bottom-width:2px;border-radius:5px;padding:0 6px;font-size:.85em}
.hljs-keyword,.hljs-selector-tag,.hljs-literal,.hljs-built_in{color:#c3a6ff}
.hljs-string,.hljs-regexp,.hljs-addition{color:#8fc47c}
.hljs-number,.hljs-attr,.hljs-variable,.hljs-template-variable{color:#e5a86b}
.hljs-title,.hljs-section,.hljs-function .hljs-title{color:#7fb4f0}
.hljs-comment,.hljs-quote,.hljs-meta{color:#7d776f;font-style:italic}
.hljs-type,.hljs-class .hljs-title,.hljs-symbol,.hljs-bullet{color:#e0cd7e}
.hljs-deletion{color:#e57c7c}

/* callouts */
.callout{--c:68,138,255;border-radius:10px;padding:12px 16px;margin:1.2em 0;background:rgba(var(--c),.1);overflow:hidden}
.callout-title{display:flex;align-items:center;gap:9px;font-weight:500;color:rgb(var(--c))}
.callout-content{margin-top:6px;color:var(--text)}
.callout-content>*:first-child{margin-top:0}.callout-content>*:last-child{margin-bottom:0}

/* gallery */
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:22px 18px;margin-top:22px}
.gallery:hover .gi,.gallery:hover .gadd{opacity:.32;filter:saturate(.5)}
.gallery .gi:hover,.gallery .gadd:hover{opacity:1;filter:none}
.gi{position:relative;cursor:pointer;transition:opacity .3s ease,filter .3s ease;text-decoration:none;color:inherit;display:block}
.thumb{position:relative;aspect-ratio:4/3;border-radius:12px;overflow:hidden;border:1px solid var(--border);background:var(--r1)}
.thumb img{width:100%;height:100%;object-fit:cover;border-radius:0;transition:transform .55s ease;display:block}
.gi:hover .thumb img,.gi:hover .ph{transform:scale(1.05)}
.ph{position:absolute;inset:0;display:grid;place-items:center;transition:transform .55s ease;background-image:radial-gradient(rgba(255,255,255,.05) 1px,transparent 1px);background-size:14px 14px}
.ph b{font-size:2.6rem;font-weight:700;color:rgba(255,255,255,.16);letter-spacing:.04em}
.shade{position:absolute;inset:0;background:linear-gradient(to top,rgba(14,13,12,.82),transparent 58%);opacity:0;transition:opacity .3s;display:flex;align-items:flex-end;padding:12px;font-size:12px;color:#e8e4de}
.gi:hover .shade{opacity:1}
.cap{padding:9px 2px 0}
.cap b{display:block;font-weight:500}
.cap span{color:var(--faint);font-size:12.5px;display:block}
.gtools{position:absolute;top:8px;right:8px;display:none;gap:4px;z-index:3}
body.editing .gtools{display:flex}
.gtools button{width:28px;height:28px;border-radius:7px;border:1px solid var(--border);background:rgba(27,26,25,.9);color:var(--muted);display:grid;place-items:center;cursor:pointer}
.gtools button:hover{color:var(--text)}
.gadd{display:none;aspect-ratio:4/3;border:1.5px dashed #4a4642;border-radius:12px;place-items:center;align-content:center;gap:8px;color:var(--faint);cursor:pointer;background:none;font-size:12.5px;transition:opacity .3s,filter .3s}
body.editing .gadd{display:grid}
.gadd:hover{color:var(--text);border-color:var(--muted)}

/* right panel */
.right{width:264px;flex:none;background:var(--r2);border-left:1px solid var(--border);display:flex;flex-direction:column;min-width:0}
.rhead{display:flex;gap:4px;padding:8px 10px;border-bottom:1px solid var(--border);height:42px;align-items:center}
.rlist{flex:1;overflow:auto;padding:10px 8px 60px}
.rtitle{padding:2px 10px 8px;color:var(--faint);font-size:12px;letter-spacing:.06em;text-transform:uppercase}
.tagrow{display:flex;justify-content:space-between;gap:10px;padding:5px 12px;border-radius:6px;cursor:pointer;color:var(--muted)}
.tagrow:hover{background:var(--hover);color:var(--text)}
.tagrow em{font-style:normal;color:var(--faint)}
.orow{padding:4px 10px;border-radius:6px;cursor:pointer;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.orow:hover{background:var(--hover);color:var(--text)}
.empty{padding:14px;color:var(--faint);font-size:13px}

/* status */
.status{position:fixed;right:12px;bottom:10px;display:flex;gap:14px;align-items:center;font-size:12px;color:var(--muted);background:rgba(27,26,25,.88);padding:4px 12px;border-radius:8px;border:1px solid var(--border);backdrop-filter:blur(6px);z-index:20}

/* modal */
.mbg{position:fixed;inset:0;background:rgba(10,9,9,.62);backdrop-filter:blur(2px);z-index:100;display:flex;align-items:flex-start;justify-content:center;padding:9vh 16px 16px;overflow:auto}
.modal{width:100%;max-width:560px;background:var(--r1);border:1px solid var(--border);border-radius:14px;box-shadow:0 24px 70px rgba(0,0,0,.5);overflow:hidden}
.mhead{padding:16px 20px 4px;font-weight:700;font-size:1.05rem}
.mbody{padding:10px 20px 4px}
.mfoot{display:flex;gap:8px;justify-content:flex-end;padding:14px 20px 18px}
.sw-in{width:100%;border:0;border-bottom:1px solid var(--border);background:none;color:var(--text);font:inherit;font-size:15px;padding:16px 20px;outline:none}
.sw-list{max-height:52vh;overflow:auto;padding:6px}
.sw-item{display:flex;gap:10px;align-items:center;padding:8px 12px;border-radius:8px;cursor:pointer;color:var(--muted)}
.sw-item small{margin-left:auto;color:var(--faint)}
.sw-item.sel{background:var(--active);color:var(--text)}
label.f{display:block;margin:12px 0 4px;color:var(--faint);font-size:12px;letter-spacing:.06em;text-transform:uppercase}
.inp,.ta,select.inp{width:100%;background:var(--r0);border:1px solid var(--border);border-radius:8px;padding:9px 12px;color:var(--text);font:inherit;font-size:13.5px;outline:none}
.inp:focus,.ta:focus{border-color:var(--accent)}
.ta{min-height:170px;resize:vertical;line-height:1.6}
.btn{padding:7px 16px;border-radius:8px;border:1px solid var(--border);background:var(--r0);color:var(--text);cursor:pointer}
.btn:hover{border-color:#4f4a46}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#14112b;font-weight:700}
.btn.danger:hover{border-color:#c4566a;color:#e98a9a}
.rp{display:flex;align-items:flex-start;gap:12px;padding:9px 6px;border-bottom:1px solid var(--border);cursor:pointer}
.rp:last-child{border:0}
.rp input{margin-top:5px;accent-color:var(--accent)}
.rp small{display:block;color:var(--faint);font-size:12px}
.rp .meta{margin-left:auto;color:var(--faint);font-size:12px;white-space:nowrap}
.rplist{max-height:40vh;overflow:auto;margin:6px 0}
.hint{color:var(--faint);font-size:12.5px;margin:8px 0}
.toast{position:fixed;left:50%;bottom:54px;transform:translateX(-50%);background:var(--r1);border:1px solid var(--border);padding:9px 16px;border-radius:10px;z-index:200;font-size:13px;box-shadow:0 10px 30px rgba(0,0,0,.4);max-width:90vw}

/* graph */
.graph{position:absolute;inset:0}
.graph canvas{width:100%;height:100%;display:block}
.glegend{position:absolute;left:16px;top:14px;color:var(--faint);font-size:12px;display:flex;gap:14px;pointer-events:none}
.glegend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}

.skel{height:12px;border-radius:6px;background:linear-gradient(90deg,#2a2826,#34312e,#2a2826);background-size:200% 100%;animation:sh 1.2s infinite;margin:14px 0}
@keyframes sh{to{background-position:-200% 0}}

body.no-side .sidebar{display:none}
body.no-right .right{display:none}
.only-mobile{display:none}
@media (max-width:1100px){.right{display:none}}
@media (max-width:760px){
  .ribbon{display:none}
  .only-mobile{display:grid}
  .sidebar{position:fixed;z-index:60;left:0;top:0;bottom:0;transform:translateX(-102%);transition:transform .2s;box-shadow:0 0 40px rgba(0,0,0,.6)}
  body.side-open .sidebar{transform:none}
  body.no-side .sidebar{display:flex}
  .note{padding:20px 20px 120px}
  .inline-title{font-size:1.55rem}
  .prow{grid-template-columns:90px 1fr}
  .status{left:12px;right:12px;justify-content:space-between}
  .mbg{padding-top:4vh}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

</div>

function allNotes() {
  const out = [], seen = new Set();
  const add = n => { if (!seen.has(n.id)) { seen.add(n.id); out.push(n); } };
  STATIC.forEach(add);
  S.cfg.repos.forEach(r => {
    const name = r.repo.split('/')[1], m = S.meta[r.repo];
    add({ id:'Projects/' + name, title:name, folder:'Projects', kind:'repo', repo:r.repo, sub:m?.description || '',
          tags:['project', ...(m ? [m.language, ...(m.topics || [])] : []).filter(Boolean).map(t => String(t).toLowerCase().replace(/\s+/g, '-'))] });
  });
  S.cfg.notes.forEach(n => add({ id:(n.folder ? n.folder + '/' : '') + n.title, title:n.title, folder:n.folder, kind:'custom', cid:n.id, md:n.body, tags:n.tags.map(t => t.toLowerCase()), order:50 }));
  return out;
}
function noteById(id) {
  if (id === 'graph') return { id, title:'Graph view', kind:'graph', folder:'', icon:'graph', tags:[] };
  if (id.startsWith('tag/')) return { id, title:'#' + id.slice(4), kind:'tag', folder:'', icon:'tag', tags:[] };
  return allNotes().find(n => n.id === id) || null;
}
const findNote = t => { t = t.toLowerCase(); return allNotes().find(n => n.title.toLowerCase() === t || n.id.toLowerCase() === t); };
function tagCounts() {
  const c = {}; allNotes().forEach(n => (n.tags || []).forEach(t => c[t] = (c[t] || 0) + 1));
  return Object.entries(c).sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]));
}
function backlinks(id) {
  const me = noteById(id); if (!me) return 0; let n = 0;
  allNotes().forEach(o => {
    if (o.id === id) return;
    if (o.md && [...o.md.matchAll(/\[\[([^\]|\n]+)/g)].some(m => { const t = findNote(m[1].trim()); return t && t.id === id; })) n++;

}

const HOUR = 3600e3;
async function loadMeta(repo) {
  if (S.meta[repo]) return S.meta[repo];
  const c = ls.get('meta:' + repo);
  if (c) { try { const j = JSON.parse(c); if (Date.now() - j.t < HOUR) return S.meta[repo] = j.d; } catch (e) {} }
  try {
    const r = await fetch(`https://api.github.com/repos/${repo}`, { headers:{ Accept:'application/vnd.github+json' } });
    if (!r.ok) throw new Error(r.status);
    const j = await r.json();
    const d = { description:j.description || '', language:j.language || '', stars:j.stargazers_count || 0, topics:j.topics || [], pushed:j.pushed_at, url:j.html_url, homepage:j.homepage || '', license:j.license?.spdx_id || '' };
    ls.set('meta:' + repo, JSON.stringify({ t:Date.now(), d }));
    return S.meta[repo] = d;
  } catch (e) { return null; }
}
async function loadReadme(repo) {
  if (S.readmes[repo]) return S.readmes[repo];
  const c = ss.get('readme:' + repo); if (c) return S.readmes[repo] = c;
  let txt = null;
  for (const f of ['README.md', 'readme.md', 'Readme.md']) {
    try { const r = await fetch(`https://raw.githubusercontent.com/${repo}/HEAD/${f}`); if (r.ok) { txt = await r.text(); break; } } catch (e) {}
  }
  if (txt == null) {
    try { const r = await fetch(`https://api.github.com/repos/${repo}/readme`, { headers:{ Accept:'application/vnd.github.raw+json' } }); if (r.ok) txt = await r.text(); } catch (e) {}
  }

}

function openSwitcher() {

    const inp = $('.sw-in', m), list = $('.sw-list', m); let sel = 0, items = [];
    const draw = () => {
      const q = inp.value.toLowerCase().trim();
      items = [...allNotes(), { id:'graph', title:'Graph view', folder:'', icon:'graph', tags:[] }].filter(n => !q || n.title.toLowerCase().includes(q) || (n.tags || []).some(t => t.includes(q)) || n.folder.toLowerCase().includes(q));

  const sel = new Set(S.cfg.repos.map(r => r.repo)); let list = null, err = '';
  modal(`<div class="mhead">Choose repositories</div><div class="mbody"><p class="hint">Each selected repo becomes a page under <b>Projects</b>, rendered from its README.</p><div class="rplist" id="rpl"><div class="skel"></div><div class="skel"></div><div class="skel"></div></div><label class="f">Or add any public repo (owner/name)</label><div style="display:flex;gap:8px"><input class="inp" id="rpm" placeholder="vllknny/some-repo"><button class="btn" id="rpa">Add</button></div></div><div class="mfoot"><button class="btn" id="rpc">Cancel</button><button class="btn pri" id="rps">Apply</button></div>`, (m, close) => {
    const box = $('#rpl', m);
    const draw = () => {
      box.innerHTML = '';
      const rows = [...(list || []).map(r => ({ repo:r.full_name, desc:r.description, lang:r.language, stars:r.stargazers_count, fork:r.fork })),
        ...[...sel].filter(r => !(list || []).some(x => x.full_name === r)).map(r => ({ repo:r, desc:'', lang:'', stars:null }))];
      if (err) box.append(mk('div', 'hint', esc(err)));
      rows.forEach(r => {
        const row = mk('label', 'rp', `<input type="checkbox" ${sel.has(r.repo) ? 'checked' : ''}><span><b>${esc(r.repo.split('/')[1])}</b>${r.fork ? ' <small style="display:inline">fork</small>' : ''}<small>${esc(r.desc || r.repo)}</small></span><span class="meta">${esc(r.lang || '')}${r.stars != null ? ' · ★' + r.stars : ''}</span>`);
        $('input', row).onchange = e => { e.target.checked ? sel.add(r.repo) : sel.delete(r.repo); };
        box.append(row);
      });
    };
    draw();
    fetch(`https://api.github.com/users/${S.cfg.user}/repos?per_page=100&sort=pushed`, { headers:{ Accept:'application/vnd.github+json' } })
      .then(r => { if (!r.ok) throw new Error(r.status === 403 ? 'GitHub rate limit hit — add repos by name below.' : 'Could not list repos — add them by name below.'); return r.json(); })
      .then(j => { list = j; draw(); }).catch(e => { err = e.message; draw(); });
    $('#rpa', m).onclick = () => { const v = $('#rpm', m).value.trim().replace(/^https?:\/\/github\.com\//, '').replace(/\/$/, ''); if (/^[\w.-]+\/[\w.-]+$/.test(v)) { sel.add(v); $('#rpm', m).value = ''; draw(); } else toast('Use the form owner/name'); };
    $('#rpc', m).onclick = close;
    $('#rps', m).onclick = () => {
      const keep = S.cfg.repos.filter(r => sel.has(r.repo)), have = new Set(keep.map(r => r.repo));
      [...sel].forEach(r => { if (!have.has(r)) keep.push({ repo:r }); });
      S.cfg.repos = keep; saveDraft(); close();
      S.tabs = S.tabs.filter(t => noteById(t)); if (!noteById(S.active)) nav('Home'); else renderAll();
      prefetchMeta().then(renderAll);
    };
  });
}
function openNoteEditor(cid) {
  const ex = S.cfg.notes.find(n => n.id === cid);
  modal(`<div class="mhead">${ex ? 'Edit note' : 'New note'}</div><div class="mbody"><label class="f">Title</label><input class="inp" id="nt" value="${esc(ex?.title || '')}"><label class="f">Folder</label><select class="inp" id="nf"><option value="">Vault root</option><option value="Projects" ${ex?.folder === 'Projects' ? 'selected' : ''}>Projects</option></select><label class="f">Tags (comma-separated)</label><input class="inp" id="ng" value="${esc((ex?.tags || []).join(', '))}"><label class="f">Markdown — supports [[wikilinks]] and &gt; [!callouts]</label><textarea class="ta" id="nb">${esc(ex?.body || '')}</textarea></div><div class="mfoot">${ex ? '<button class="btn danger" id="nd" style="margin-right:auto">Delete</button>' : ''}<button class="btn" id="nc">Cancel</button><button class="btn pri" id="ns">Save</button></div>`, (m, close) => {
    $('#nc', m).onclick = close;
    $('#nd', m)?.addEventListener('click', () => { S.cfg.notes = S.cfg.notes.filter(n => n.id !== cid); saveDraft(); close(); S.tabs = S.tabs.filter(t => noteById(t)); nav('Home'); renderAll(); });
    $('#ns', m).onclick = () => {
      const title = $('#nt', m).value.trim().replace(/[\/\\]/g, '-'); if (!title) return toast('Give the note a title');
      const o = { id:ex?.id || 'n' + Math.random().toString(36).slice(2, 8), title, folder:$('#nf', m).value, tags:$('#ng', m).value.split(',').map(t => t.trim().toLowerCase()).filter(Boolean), body:$('#nb', m).value };
      if (ex) Object.assign(ex, o); else S.cfg.notes.push(o);
      saveDraft(); close(); nav((o.folder ? o.folder + '/' : '') + o.title); renderAll();
    };
  }, '680px');
}
function openGalleryEditor(i) {
  const ex = i >= 0 ? S.cfg.gallery[i] : null; let img = ex?.image || '';
  const opts = allNotes().filter(n => n.kind !== 'gallery').map(n => `<option value="${esc(n.id)}" ${ex?.route === n.id ? 'selected' : ''}>${esc(n.id)}</option>`).join('');
  modal(`<div class="mhead">${ex ? 'Edit portfolio item' : 'Add portfolio item'}</div><div class="mbody"><label class="f">Title</label><input class="inp" id="gt" value="${esc(ex?.title || '')}"><label class="f">Subtitle</label><input class="inp" id="gs" value="${esc(ex?.sub || '')}" placeholder="Python · PyTorch"><label class="f">Links to</label><select class="inp" id="gr"><option value="">External URL ↓</option>${opts}</select><input class="inp" id="gu" style="margin-top:8px" placeholder="https://…" value="${esc(ex?.url || '')}"><label class="f">Cover image</label><input class="inp" type="file" id="gf" accept="image/*"><input class="inp" id="gi" style="margin-top:8px" placeholder="…or an image URL / path in the repo, e.g. images/ssampler.png" value="${esc(img.startsWith('data:') ? '' : img)}"><p class="hint">Uploads are resized to 1000px and embedded in site-config.json. For a lighter page, commit the image to the repo and use its path instead.</p></div><div class="mfoot"><button class="btn" id="gc">Cancel</button><button class="btn pri" id="gsv">Save</button></div>`, (m, close) => {
    $('#gc', m).onclick = close;
    $('#gf', m).onchange = e => {
      const f = e.target.files[0]; if (!f) return; const url = URL.createObjectURL(f), im = new Image();
      im.onload = () => { const s = Math.min(1, 1000 / im.width), c = mk('canvas'); c.width = im.width * s; c.height = im.height * s; c.getContext('2d').drawImage(im, 0, 0, c.width, c.height); img = c.toDataURL('image/jpeg', .82); URL.revokeObjectURL(url); toast('Image ready'); };
      im.onerror = () => toast('Could not read that image'); im.src = url;
    };
    $('#gsv', m).onclick = () => {
      const title = $('#gt', m).value.trim(); if (!title) return toast('Give it a title');
      const typed = $('#gi', m).value.trim(), o = { title, sub:$('#gs', m).value.trim(), route:$('#gr', m).value, url:$('#gu', m).value.trim(), image:typed || img };
      if (o.url && !/^https?:\/\//i.test(o.url)) return toast('That link must start with http(s)://');
      if (i >= 0) S.cfg.gallery[i] = o; else S.cfg.gallery.push(o);
      saveDraft(); close(); renderMain();
    };
  });
}
async function prefetchMeta() { await Promise.all(S.cfg.repos.map(r => loadMeta(r.repo))); }

/* ───────────── boot ───────────── */
async function boot() {
  $('#newtab').onclick = openSwitcher;
  $('#rtoggle').onclick = () => document.body.classList.toggle('no-right');
  $('#mmenu').onclick = () => document.body.classList.toggle('side-open');
  $('#sidebar').addEventListener('click', e => { if (e.target.closest('a.row') && innerWidth <= 760) document.body.classList.remove('side-open'); });
  try { const r = await fetch('site-config.json', { cache:'no-store' }); if (r.ok) S.committed = normalize(await r.json()); } catch (e) {}
  S.cfg = structuredClone(S.committed);
  if (S.editing) { document.body.classList.add('editing'); const d = ls.get(DRAFT_KEY); if (d) { try { S.cfg = normalize(JSON.parse(d)); } catch (e) {} } }
  if (innerWidth <= 1100) document.body.classList.add('no-right');
  openNote(idFromHash());
  prefetchMeta().then(() => { renderTree(); renderRight(); if (S.active === 'Home' || S.active === 'graph') renderMain(); });
}
boot();
})();
</script>
</body>
